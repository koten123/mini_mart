<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Giỏ hàng – MiniMart</title>
    <link rel="icon" href="images/logo.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cart.css">
</head>
<body>
<header>
    <a href="index.html"><img class="logo" src="images/logo-mark.png" alt="MiniMart – Siêu thị của bạn"></a>
    <button class="burger" onclick="doiMenu()" aria-label="Mở menu">☰</button>
    <nav id="menu">
        <ul>
            <li><a href="index.html">Trang chủ</a></li>
            <li><a href="products.html">Sản phẩm</a></li>
            <li><a href="cart.html">Giỏ hàng</a></li>
            <li><a href="member.html">Hội viên</a></li>
        </ul>
    </nav>
</header>
<main>
<h1>Giỏ hàng</h1>
<p class="ok" id="thanhcong" role="status"></p>
<p id="trong">Giỏ hàng của bạn đang trống. <a href="products.html">Mua sắm ngay</a></p>
<div class="layout" id="noiDung">
    <div>
        <table id="gio">
            <thead><tr><th>Sản phẩm</th><th>Giá</th><th>Số lượng</th><th>Thành tiền</th><th></th></tr></thead>
            <tbody id="cartBody"></tbody>
        </table>
    </div>
    <aside>
        <div class="box">
            <p><span>Tạm tính</span><span id="tam"></span></p>
            <p><span>Phí giao hàng</span><span id="ship"></span></p>
            <p class="total"><span>Tổng tiền</span><span id="tong"></span></p>
        </div>
        <div class="box">
            <h2>Thông tin nhận hàng</h2>
            <label for="ten">Họ tên</label><input id="ten"><span class="err" id="l_ten"></span>
            <label for="sdt">Số điện thoại</label><input id="sdt" inputmode="numeric"><span class="err" id="l_sdt"></span>
            <label for="diachi">Địa chỉ</label><input id="diachi"><span class="err" id="l_diachi"></span>
            <p><button class="btn btn-yellow" id="nutDat" onclick="datHang()">Đặt hàng</button></p>
        </div>
    </aside>
</div>
</main>
<footer>
    &copy; Copyright 2026 - MiniMart · Siêu thị của bạn · Hotline: 1900 0000
</footer>
<script src="js/home.js"></script>
<script src="js/cart.js"></script>
</body>
</html>
